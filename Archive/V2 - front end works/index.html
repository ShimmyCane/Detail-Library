<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Library Debugger</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #status-bar { padding: 10px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        #details-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .detail-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        img { width: 100%; height: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Detail Library</h1>
    <div id="status-bar">Checking status...</div>
    <div id="details-list"></div>

    <script>
        const statusBar = document.getElementById('status-bar');
        const list = document.getElementById('details-list');

        fetch('details.json')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (!Array.isArray(data)) {
                    throw new Error("JSON format error: Expected an array of objects.");
                }
                if (data.length === 0) {
                    statusBar.className = 'error';
                    statusBar.innerText = "JSON is empty.";
                    return;
                }
                
                statusBar.className = 'success';
                statusBar.innerText = `Successfully loaded ${data.length} details.`;

                data.forEach(detail => {
                    const div = document.createElement('div');
                    div.className = 'detail-card';
                    div.innerHTML = `
                        <img src="images/${detail.filename}" alt="${detail.filename}" onerror="this.style.display='none'">
                        <h3>${detail.filename}</h3>
                        <p>${detail.description || 'No description'}</p>
                        <small>Tags: ${detail.tags ? detail.tags.join(', ') : 'None'}</small>
                    `;
                    list.appendChild(div);
                });
            })
            .catch(err => {
                statusBar.className = 'error';
                statusBar.innerText = "Error: " + err.message;
                console.error(err);
            });
    </script>
</body>
</html>
