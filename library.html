<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Library</title>
    <style>
        :root {
            --paper: #fbfbf8;
            --ink: #1d1d1b;
            --muted: #6b6b66;
            --line: #d9d9d2;
            --card: #ffffff;
            --accent: #2a5db0;
            --accent-ink: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --paper: #151515;
                --ink: #ececea;
                --muted: #9a9a94;
                --line: #333331;
                --card: #1f1f1e;
                --accent: #6f9be0;
                --accent-ink: #0d0d0d;
            }
        }
        :root[data-theme="dark"] {
            --paper: #151515;
            --ink: #ececea;
            --muted: #9a9a94;
            --line: #333331;
            --card: #1f1f1e;
            --accent: #6f9be0;
            --accent-ink: #0d0d0d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.4;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            padding: 16px;
        }
        h1 { font-size: 20px; margin: 0 0 12px; font-weight: 600; }
        h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        input[type="search"], select {
            font: inherit;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 10px;
        }
        input[type="search"] { flex: 1 1 220px; min-width: 0; }
        .chip {
            font: inherit;
            font-size: 13px;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 4px 12px;
            cursor: pointer;
        }
        .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        main { padding: 16px; }
        .empty { color: var(--muted); padding: 40px 0; text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }
        .card:focus-visible, .chip:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .thumb {
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
        }
        .thumb img, .thumb canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        .card-title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
        .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .badge {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 0 5px;
        }
        dialog {
            width: min(96vw, 1200px);
            height: min(92vh, 900px);
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--ink);
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
        .viewer { display: flex; flex-direction: column; height: 100%; }
        .viewer-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
        }
        .viewer-head h2 { font-size: 16px; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .viewer-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; }
        .viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .viewer-body iframe { width: 100%; height: 100%; border: 0; }
        .link-btn { color: var(--accent); text-decoration: none; font-size: 14px; }
        .link-btn:hover { text-decoration: underline; }
        .close-btn { font: inherit; background: none; border: 0; color: var(--ink); font-size: 22px; cursor: pointer; line-height: 1; }
        @media (max-width: 480px) {
            header, main { padding: 12px; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Detail Library <span id="count"></span></h1>
        <div class="controls">
            <input type="search" id="search" placeholder="Search title or folder" aria-label="Search the library">
            <select id="kind" aria-label="File type">
                <option value="all">All types</option>
                <option value="raster">Images</option>
                <option value="vector">Vector (SVG)</option>
                <option value="pdf">PDF</option>
            </select>
            <select id="sort" aria-label="Sort">
                <option value="name">Name</option>
                <option value="folder">Folder</option>
            </select>
        </div>
        <div class="tags" id="tags" role="group" aria-label="Filter by folder"></div>
    </header>
    <main>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden>Nothing matches.</p>
    </main>

    <dialog id="viewer" aria-label="Detail viewer">
        <div class="viewer">
            <div class="viewer-head">
                <h2 id="viewer-title"></h2>
                <a class="link-btn" id="viewer-open" target="_blank" rel="noopener">Open file</a>
                <button class="close-btn" id="viewer-close" aria-label="Close">×</button>
            </div>
            <div class="viewer-body" id="viewer-body"></div>
        </div>
    </dialog>

    <!-- The library itself: generated by generate_library.py from images/raw/. -->
    <script src="library-data.js"></script>
    <!-- pdf.js renders the first page of each PDF as its thumbnail. The page still works without it. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        (function () {
            'use strict';

            var items = Array.isArray(window.LIBRARY_ITEMS) ? window.LIBRARY_ITEMS : [];
            var state = { query: '', kind: 'all', sort: 'name', tags: [] };

            var els = {
                count: document.getElementById('count'),
                search: document.getElementById('search'),
                kind: document.getElementById('kind'),
                sort: document.getElementById('sort'),
                tags: document.getElementById('tags'),
                grid: document.getElementById('grid'),
                empty: document.getElementById('empty'),
                dialog: document.getElementById('viewer'),
                dTitle: document.getElementById('viewer-title'),
                dOpen: document.getElementById('viewer-open'),
                dBody: document.getElementById('viewer-body'),
                dClose: document.getElementById('viewer-close')
            };

            // Encodes each part of a path so names with spaces or # still resolve.
            function urlOf(path) {
                return path.split('/').map(encodeURIComponent).join('/');
            }

            function kindLabel(kind) {
                return kind === 'raster' ? 'image' : kind === 'vector' ? 'svg' : 'pdf';
            }

            function sortItems(list) {
                var copy = list.slice();
                copy.sort(function (a, b) {
                    if (state.sort === 'folder') {
                        return a.folder.localeCompare(b.folder) || a.title.localeCompare(b.title);
                    }
                    return a.title.localeCompare(b.title) || a.folder.localeCompare(b.folder);
                });
                return copy;
            }

            function matches(item) {
                if (state.kind !== 'all' && item.kind !== state.kind) return false;
                for (var i = 0; i < state.tags.length; i++) {
                    if (item.tags.indexOf(state.tags[i]) < 0) return false;
                }
                if (!state.query) return true;
                return (item.title + ' ' + item.folder).toLowerCase().indexOf(state.query) >= 0;
            }

            // Every folder name, once, for the tag chips. Picking several tags keeps files that have all of them.
            function allTags() {
                var seen = {};
                items.forEach(function (item) {
                    item.tags.forEach(function (t) { seen[t] = true; });
                });
                return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b); });
            }

            function renderTags() {
                els.tags.innerHTML = '';
                var all = document.createElement('button');
                all.className = 'chip' + (state.tags.length ? '' : ' on');
                all.textContent = 'All folders';
                all.addEventListener('click', function () { state.tags = []; render(); });
                els.tags.appendChild(all);
                allTags().forEach(function (tag) {
                    var on = state.tags.indexOf(tag) >= 0;
                    var b = document.createElement('button');
                    b.className = 'chip' + (on ? ' on' : '');
                    b.setAttribute('aria-pressed', String(on));
                    b.textContent = tag;
                    b.addEventListener('click', function () {
                        state.tags = on
                            ? state.tags.filter(function (x) { return x !== tag; })
                            : state.tags.concat([tag]);
                        render();
                    });
                    els.tags.appendChild(b);
                });
            }

            // Thumbnails are drawn when a card scrolls into view, so a large library stays light.
            var observer = 'IntersectionObserver' in window
                ? new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (!entry.isIntersecting) return;
                        observer.unobserve(entry.target);
                        entry.target.dispatchEvent(new Event('show'));
                    });
                }, { rootMargin: '200px' })
                : null;

            function makeThumb(item) {
                var wrap = document.createElement('div');
                wrap.className = 'thumb';
                if (item.kind === 'pdf') {
                    var canvas = document.createElement('canvas');
                    wrap.appendChild(canvas);
                    wrap.dataset.kind = 'pdf';
                    wrap.addEventListener('show', function () { renderPdfThumb(item, canvas, wrap); });
                } else {
                    var img = document.createElement('img');
                    img.alt = item.title;
                    img.loading = 'lazy';
                    img.src = urlOf(item.path);
                    wrap.appendChild(img);
                }
                return wrap;
            }

            function renderPdfThumb(item, canvas, wrap) {
                if (!window.pdfjsLib) {
                    wrap.textContent = 'PDF';
                    return;
                }
                window.pdfjsLib.getDocument(urlOf(item.path)).promise
                    .then(function (doc) { return doc.getPage(1); })
                    .then(function (page) {
                        var base = page.getViewport({ scale: 1 });
                        var width = wrap.clientWidth || 260;
                        var scale = width / base.width;
                        var vp = page.getViewport({ scale: scale });
                        canvas.width = Math.floor(vp.width);
                        canvas.height = Math.floor(vp.height);
                        return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                    })
                    .catch(function () { wrap.textContent = 'PDF'; });
            }

            function openViewer(item) {
                els.dTitle.textContent = item.title;
                els.dOpen.href = urlOf(item.path);
                els.dBody.innerHTML = '';
                if (item.kind === 'pdf') {
                    var frame = document.createElement('iframe');
                    frame.src = urlOf(item.path) + '#view=FitH';
                    frame.title = item.title;
                    els.dBody.appendChild(frame);
                } else {
                    var img = document.createElement('img');
                    img.alt = item.title;
                    img.src = urlOf(item.path);
                    els.dBody.appendChild(img);
                }
                if (typeof els.dialog.showModal === 'function') els.dialog.showModal();
                else window.open(urlOf(item.path), '_blank');
            }

            function renderGrid(list) {
                els.grid.innerHTML = '';
                list.forEach(function (item) {
                    var card = document.createElement('article');
                    card.className = 'card';
                    card.tabIndex = 0;
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', 'Open ' + item.title);

                    var thumb = makeThumb(item);
                    var title = document.createElement('div');
                    title.className = 'card-title';
                    title.textContent = item.title;
                    var meta = document.createElement('div');
                    meta.className = 'meta';
                    var badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = kindLabel(item.kind);
                    meta.appendChild(badge);
                    meta.appendChild(document.createTextNode(item.folder || 'unsorted'));

                    card.appendChild(thumb);
                    card.appendChild(title);
                    card.appendChild(meta);
                    card.addEventListener('click', function () { openViewer(item); });
                    card.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(item); }
                    });
                    els.grid.appendChild(card);

                    if (item.kind === 'pdf' && observer) {
                        observer.observe(thumb);
                    } else if (item.kind === 'pdf') {
                        thumb.dispatchEvent(new Event('show'));
                    }
                });
            }

            function render() {
                var list = sortItems(items.filter(matches));
                els.count.textContent = list.length === items.length
                    ? items.length + (items.length === 1 ? ' file' : ' files')
                    : list.length + ' of ' + items.length + ' files';
                renderTags();
                renderGrid(list);
                els.empty.textContent = items.length ? 'Nothing matches.' : 'No files yet. Add images, SVGs or PDFs under images/raw/, then run generate_library.py.';
                els.empty.hidden = list.length > 0;
            }

            els.search.addEventListener('input', function () {
                state.query = els.search.value.trim().toLowerCase();
                render();
            });
            els.kind.addEventListener('change', function () { state.kind = els.kind.value; render(); });
            els.sort.addEventListener('change', function () { state.sort = els.sort.value; render(); });
            els.dClose.addEventListener('click', function () { els.dialog.close(); });
            els.dialog.addEventListener('click', function (e) { if (e.target === els.dialog) els.dialog.close(); });
            els.dialog.addEventListener('close', function () { els.dBody.innerHTML = ''; });

            if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            render();
        })();
    </script>
</body>
</html>
