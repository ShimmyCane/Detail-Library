<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Library</title>
    <style>
        :root {
            --paper: #fbfbf8; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d2;
            --card: #ffffff; --accent: #2a5db0; --accent-ink: #ffffff; --sheet: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --paper: #151515; --ink: #ececea; --muted: #9a9a94; --line: #333331;
                --card: #1f1f1e; --accent: #6f9be0; --accent-ink: #0d0d0d; --sheet: #ffffff;
            }
        }
        :root[data-theme="dark"] {
            --paper: #151515; --ink: #ececea; --muted: #9a9a94; --line: #333331;
            --card: #1f1f1e; --accent: #6f9be0; --accent-ink: #0d0d0d; --sheet: #ffffff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.4; }
        a { color: var(--accent); }
        header { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 16px; }
        .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        h1 { font-size: 20px; margin: 0; font-weight: 600; }
        .count { color: var(--muted); font-size: 14px; }
        .home { margin-left: auto; font-size: 14px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        input[type="search"], input[type="text"], input[type="email"], input[type="password"], select {
            font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
        }
        input[type="search"] { flex: 1 1 200px; min-width: 0; }
        .chip, button.plain, button.primary {
            font: inherit; font-size: 13px; color: var(--ink); background: var(--card);
            border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
        }
        button.plain { border-radius: 6px; }
        button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); border-radius: 6px; }
        .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .seg { display: inline-flex; }
        .chip.icon { padding: 4px 11px; font-size: 16px; line-height: 1; }
        .seg .chip { border-radius: 0; }
        .seg .chip:first-child { border-radius: 999px 0 0 999px; }
        .seg .chip:last-child { border-radius: 0 999px 999px 0; }
        button:disabled { opacity: 0.5; cursor: default; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
        .warn { color: #9a5b00; }
        .cloudbox { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 12px; margin-bottom: 14px; display: grid; gap: 8px; }
        .cloudbox[hidden] { display: none; }
        .cloudbox .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .cloudbox input { flex: 1 1 180px; min-width: 0; }
        main { padding: 16px; }
        .empty { color: var(--muted); padding: 40px 0; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card {
            background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
            cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0;
        }
        .card:focus-visible, .chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px;
        }
        .thumb {
            aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
            background: var(--sheet); border-radius: 4px; overflow: hidden;
        }
        .thumb img, .thumb canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        body.bg-dark .thumb { background: #111111; }
        body.bg-mono .thumb img, body.bg-mono .thumb canvas { filter: grayscale(1) contrast(1.1); }
        .card-title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
        .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .badge { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
        .badge.warn { color: #9a5b00; border-color: #9a5b00; }
        .user-tag { font-size: 11px; background: var(--paper); border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 5px; }
        dialog {
            width: min(96vw, 1200px); height: min(92vh, 900px); padding: 0;
            border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink);
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
        .viewer { display: flex; flex-direction: column; height: 100%; }
        .viewer-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
        .viewer-head h2 { font-size: 16px; margin: 0; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
        .viewer-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: var(--sheet); }
        .viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .viewer-body iframe { width: 100%; height: 100%; border: 0; }
        .viewer-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: grid; gap: 8px; max-height: 40vh; overflow: auto; }
        .viewer-credit { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
        .inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .inline input { flex: 1 1 200px; min-width: 0; }
        .close-btn { font: inherit; background: none; border: 0; color: var(--ink); font-size: 22px; cursor: pointer; line-height: 1; }
        button.danger { background: #b3261e; border-color: #b3261e; color: #ffffff; border-radius: 6px; font: inherit; font-size: 13px; padding: 4px 12px; cursor: pointer; }
        .card { position: relative; }
        .pick { position: absolute; top: 14px; left: 14px; width: 20px; height: 20px; margin: 0; accent-color: var(--accent); pointer-events: none; display: none; }
        body.selecting .pick { display: block; }
        body.selecting .card { cursor: pointer; }
        .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
        .panel {
            position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); z-index: 5;
            background: var(--card); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, 0.25);
            padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            transform: translateX(105%); visibility: hidden; transition: transform 0.2s ease, visibility 0.2s;
        }
        .panel.open { transform: none; visibility: visible; }
        .panel h2 { font-size: 16px; margin: 0; flex: 1; }
        .panel h3 { font-size: 12px; margin: 0 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .panel-head { display: flex; align-items: center; gap: 8px; }
        .panel .inline input { flex: 1 1 140px; }
        .panel-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .panel .spacer { flex: 1; }
        .panel-foot { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
        dialog.confirm { width: min(92vw, 420px); height: auto; padding: 18px; }
        dialog.confirm p { margin: 0 0 14px; }
        dialog.confirm .inline { justify-content: flex-end; }
        @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
        @media (max-width: 480px) {
            header, main { padding: 12px; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .home { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="title-row">
            <h1>Library</h1>
            <span class="count" id="count"></span>
            <div class="seg" role="tablist" aria-label="Where to look">
                <button class="chip on" role="tab" data-view="local" aria-selected="true">Local</button>
                <button class="chip" role="tab" data-view="cloud" aria-selected="false">Cloud</button>
            </div>
            <button class="chip" id="select-mode" aria-pressed="false" title="Select several details to tag or delete them">Select</button>
            <button class="chip icon" id="upload" hidden title="Upload images to this device" aria-label="Upload images to this device">↑</button>
            <a class="home" href="index.html">← Home</a>
        </div>
        <div class="controls">
            <input type="search" id="search" placeholder="Search name, folder or tag" aria-label="Search the library">
            <select id="kind" aria-label="File type">
                <option value="all">All types</option>
                <option value="raster">Images</option>
                <option value="vector">Vector (SVG)</option>
                <option value="pdf">PDF</option>
            </select>
            <select id="licence" aria-label="Licence">
                <option value="all">All licences</option>
                <option value="Public domain">Public domain</option>
                <option value="CC0">CC0</option>
                <option value="CC BY">CC BY</option>
                <option value="CC BY-SA">CC BY-SA</option>
                <option value="unverified">Unverified</option>
            </select>
            <select id="sort" aria-label="Sort">
                <option value="name">Name</option>
                <option value="folder">Folder</option>
                <option value="licence">Licence</option>
                <option value="type">Type</option>
            </select>
            <div class="seg" role="group" aria-label="Card background">
                <button class="chip" data-bg="sheet">On white</button>
                <button class="chip" data-bg="dark">Dark</button>
                <button class="chip" data-bg="mono">Black on white</button>
            </div>
        </div>
        <div class="tags" id="tags" role="group" aria-label="Filter by folder or tag"></div>
        <p class="note" id="note"></p>
    </header>
    <main>
        <section class="cloudbox" id="cloudbox" hidden aria-label="Cloud library"></section>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden></p>
    </main>

    <aside class="panel" id="panel" aria-label="Selected details" aria-hidden="true">
        <div class="panel-head">
            <h2 id="panel-title">0 selected</h2>
            <button class="plain" id="panel-all" title="Select every detail that matches the current filters">Select shown</button>
            <button class="close-btn" id="panel-close" aria-label="Clear the selection">×</button>
        </div>
        <div>
            <h3>Tags to add</h3>
            <div class="panel-tags" id="panel-staged"></div>
            <p class="note" id="panel-staged-empty">Pick tags below or type your own.</p>
        </div>
        <div>
            <h3>Popular</h3>
            <div class="panel-tags" id="panel-popular"></div>
        </div>
        <div>
            <h3>Recent</h3>
            <div class="panel-tags" id="panel-recent"></div>
        </div>
        <div>
            <h3>Type tags, separated by commas</h3>
            <div class="inline">
                <input type="text" id="panel-manual" placeholder="wall, footing, flashing" aria-label="Tags separated by commas">
                <button class="plain" id="panel-stage">Add to list</button>
            </div>
        </div>
        <div class="panel-foot">
            <button class="primary" id="panel-apply">Add tags</button>
            <button class="danger" id="panel-delete">Delete selected</button>
            <p class="note" id="panel-msg" role="status"></p>
        </div>
    </aside>

    <dialog class="confirm" id="confirm" aria-label="Confirm delete">
        <p id="confirm-text"></p>
        <p class="note">After you confirm, delete will not ask again for 5 minutes.</p>
        <div class="inline">
            <button class="plain" id="confirm-cancel">Cancel</button>
            <button class="danger" id="confirm-ok">Delete</button>
        </div>
    </dialog>

    <dialog id="viewer" aria-label="Detail viewer">
        <div class="viewer">
            <div class="viewer-head">
                <h2 id="viewer-title"></h2>
                <a class="btn-link" id="viewer-file" target="_blank" rel="noopener">Open file</a>
                <button class="plain" id="viewer-qd" hidden>Open in Quick Detail</button>
                <button class="close-btn" id="viewer-close" aria-label="Close">×</button>
            </div>
            <div class="viewer-body" id="viewer-body"></div>
            <div class="viewer-foot">
                <div class="viewer-credit" id="viewer-credit"></div>
                <div class="inline">
                    <label for="viewer-name" class="note">Name</label>
                    <input type="text" id="viewer-name" maxlength="120">
                    <button class="plain" id="viewer-rename">Save name</button>
                </div>
                <div class="inline" id="viewer-tags"></div>
                <div class="inline" id="viewer-actions"></div>
                <p class="note" id="viewer-msg" role="status"></p>
            </div>
        </div>
    </dialog>

    <!-- Library items: generated by generate_library.py from images/raw/. -->
    <script src="library-data.js"></script>
    <!-- Storage on this device, then the cloud copy (same Supabase project as Quick Detail). -->
    <script src="library-store.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="library-cloud.js"></script>
    <!-- pdf.js renders the first page of each PDF as its thumbnail. The page still works without it. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        (function () {
            'use strict';

            var repoItems = Array.isArray(window.LIBRARY_ITEMS) ? window.LIBRARY_ITEMS : [];
            var S = window.DLStore;
            var C = window.DLCloud;
            var MAX_PX = 1600, THUMB_PX = 320;

            var state = {
                view: 'local', query: '', kind: 'all', licence: 'all', sort: 'name', tags: [],
                entries: [], cloudRows: null, cloudError: '', session: null, current: null, urls: {},
                selecting: false, selected: {}, staged: [], noConfirmUntil: 0
            };
            var CONFIRM_QUIET_MS = 5 * 60 * 1000;
            var cardEls = {};

            var els = {
                count: document.getElementById('count'),
                note: document.getElementById('note'),
                search: document.getElementById('search'),
                kind: document.getElementById('kind'),
                licence: document.getElementById('licence'),
                sort: document.getElementById('sort'),
                tags: document.getElementById('tags'),
                cloudbox: document.getElementById('cloudbox'),
                grid: document.getElementById('grid'),
                empty: document.getElementById('empty'),
                dialog: document.getElementById('viewer'),
                dTitle: document.getElementById('viewer-title'),
                dFile: document.getElementById('viewer-file'),
                dQd: document.getElementById('viewer-qd'),
                dBody: document.getElementById('viewer-body'),
                dCredit: document.getElementById('viewer-credit'),
                dName: document.getElementById('viewer-name'),
                dRename: document.getElementById('viewer-rename'),
                dTags: document.getElementById('viewer-tags'),
                dActions: document.getElementById('viewer-actions'),
                dMsg: document.getElementById('viewer-msg'),
                dClose: document.getElementById('viewer-close')
            };

            function urlOf(path) {
                return path.split('/').map(encodeURIComponent).join('/');
            }

            function kindOf(mime, name) {
                var n = (name || '').toLowerCase();
                if (mime === 'application/pdf' || /\.pdf$/.test(n)) return 'pdf';
                if (mime === 'image/svg+xml' || /\.svg$/.test(n)) return 'vector';
                return 'raster';
            }

            function kindLabel(kind) {
                return kind === 'raster' ? 'image' : kind === 'vector' ? 'svg' : 'pdf';
            }

            function unique(list) {
                var out = [];
                list.forEach(function (t) { if (t && out.indexOf(t) < 0) out.push(t); });
                return out;
            }

            // ---- Entries: one shape for repo files, local copies and cloud copies ----
            function repoEntries() {
                return repoItems.filter(function (item) { return !(S && S.isHidden('repo:' + item.path)); }).map(function (item) {
                    var key = 'repo:' + item.path;
                    var title = S.nameOverride(key) || item.title;
                    return {
                        key: key, source: 'repo', path: item.path, title: title, originTitle: item.title,
                        kind: item.kind, licence: item.licence, credit: item.credit || '', origin: item.source || '',
                        folder: item.folder, folderTags: item.tags.slice(), userTags: S.localTags(key)
                    };
                });
            }

            function localEntries(copies) {
                return copies.map(function (c) {
                    var key = 'local:' + c.id;
                    return {
                        key: key, source: 'local', id: c.id, title: S.nameOverride(key) || c.name, originTitle: c.name,
                        kind: c.kind, licence: c.licence || 'unverified', credit: c.credit || '', origin: c.source || '',
                        folder: '', folderTags: [], userTags: S.localTags(key), blob: c.blob, cloudId: c.cloudId || null
                    };
                });
            }

            function cloudEntries(rows) {
                return rows.map(function (r) {
                    var m = r.metadata || {};
                    return {
                        key: 'cloud:' + r.id, source: 'cloud', id: r.id, localId: r.local_id,
                        title: r.name, originTitle: r.name, kind: m.kind || 'raster',
                        licence: m.licence || 'unverified', credit: m.credit || '', origin: m.origin_url || '',
                        folder: '', folderTags: [], userTags: Array.isArray(r.tags) ? r.tags : [], thumb: m.thumb || ''
                    };
                });
            }

            function allTagsOf(e) {
                return unique(e.folderTags.concat(e.userTags));
            }

            function loadLocal() {
                if (!S) return Promise.resolve([]);
                return S.allCopies().then(function (copies) { return localEntries(copies); }).catch(function (err) {
                    els.note.textContent = 'Local copies are unavailable here: ' + err.message;
                    return [];
                });
            }

            function loadCloud() {
                if (!C || !C.ready()) {
                    state.cloudError = 'The cloud library did not load. Check the connection and reload.';
                    return Promise.resolve([]);
                }
                return C.session().then(function (s) {
                    state.session = s;
                    if (!s) { state.cloudError = ''; return []; }
                    return C.list().then(function (rows) {
                        state.cloudError = '';
                        state.cloudRows = rows;
                        return cloudEntries(rows);
                    });
                }).catch(function (err) {
                    state.cloudError = err.message || String(err);
                    return [];
                });
            }

            function refresh() {
                var base = repoEntries();
                var job = state.view === 'local'
                    ? loadLocal().then(function (local) { return base.concat(local); })
                    : loadCloud();
                return job.then(function (list) {
                    state.entries = list;
                    var keys = {};
                    list.forEach(function (e) { keys[e.key] = true; });
                    Object.keys(state.selected).forEach(function (k) { if (!keys[k]) delete state.selected[k]; });
                    render();
                    renderPanel();
                });
            }

            // ---- Filters and sorting ----
            function matches(e) {
                if (state.kind !== 'all' && e.kind !== state.kind) return false;
                if (state.licence !== 'all' && e.licence !== state.licence) return false;
                var own = allTagsOf(e);
                for (var i = 0; i < state.tags.length; i++) {
                    if (own.indexOf(state.tags[i]) < 0) return false;
                }
                if (!state.query) return true;
                return (e.title + ' ' + e.folder + ' ' + own.join(' ')).toLowerCase().indexOf(state.query) >= 0;
            }

            function sortEntries(list) {
                return list.slice().sort(function (a, b) {
                    if (state.sort === 'folder') return a.folder.localeCompare(b.folder) || a.title.localeCompare(b.title);
                    if (state.sort === 'licence') return a.licence.localeCompare(b.licence) || a.title.localeCompare(b.title);
                    if (state.sort === 'type') return a.kind.localeCompare(b.kind) || a.title.localeCompare(b.title);
                    return a.title.localeCompare(b.title) || a.folder.localeCompare(b.folder);
                });
            }

            function renderTags() {
                els.tags.innerHTML = '';
                var all = document.createElement('button');
                all.className = 'chip' + (state.tags.length ? '' : ' on');
                all.textContent = 'All';
                all.addEventListener('click', function () { state.tags = []; render(); });
                els.tags.appendChild(all);
                var seen = [];
                state.entries.forEach(function (e) { allTagsOf(e).forEach(function (t) { if (seen.indexOf(t) < 0) seen.push(t); }); });
                seen.sort(function (a, b) { return a.localeCompare(b); }).forEach(function (tag) {
                    var on = state.tags.indexOf(tag) >= 0;
                    var b = document.createElement('button');
                    b.className = 'chip' + (on ? ' on' : '');
                    b.setAttribute('aria-pressed', String(on));
                    b.textContent = tag;
                    b.addEventListener('click', function () {
                        state.tags = on ? state.tags.filter(function (x) { return x !== tag; }) : state.tags.concat([tag]);
                        render();
                    });
                    els.tags.appendChild(b);
                });
            }

            // ---- Thumbnails ----
            var observer = 'IntersectionObserver' in window
                ? new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (!entry.isIntersecting) return;
                        observer.unobserve(entry.target);
                        entry.target.dispatchEvent(new Event('show'));
                    });
                }, { rootMargin: '200px' })
                : null;

            // Object URLs for local copies, so each blob is turned into a URL once.
            function blobUrl(e) {
                if (!state.urls[e.key]) state.urls[e.key] = URL.createObjectURL(e.blob);
                return state.urls[e.key];
            }

            function srcOf(e) {
                if (e.source === 'repo') return urlOf(e.path);
                if (e.source === 'local') return blobUrl(e);
                return e.thumb;
            }

            function makeThumb(e) {
                var wrap = document.createElement('div');
                wrap.className = 'thumb';
                if (e.kind === 'pdf') {
                    var canvas = document.createElement('canvas');
                    wrap.appendChild(canvas);
                    wrap.addEventListener('show', function () { drawPdfFirstPage(e.source === 'repo' ? urlOf(e.path) : blobUrl(e), canvas, wrap); });
                } else if (srcOf(e)) {
                    var img = document.createElement('img');
                    img.alt = e.title;
                    img.loading = 'lazy';
                    img.src = srcOf(e);
                    wrap.appendChild(img);
                } else {
                    wrap.textContent = kindLabel(e.kind).toUpperCase();
                }
                return wrap;
            }

            function drawPdfFirstPage(src, canvas, wrap) {
                if (!window.pdfjsLib) { wrap.textContent = 'PDF'; return; }
                window.pdfjsLib.getDocument(src).promise
                    .then(function (doc) { return doc.getPage(1); })
                    .then(function (page) {
                        var base = page.getViewport({ scale: 1 });
                        var vp = page.getViewport({ scale: (wrap.clientWidth || 260) / base.width });
                        canvas.width = Math.floor(vp.width);
                        canvas.height = Math.floor(vp.height);
                        return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                    })
                    .catch(function () { wrap.textContent = 'PDF'; });
            }

            function renderGrid(list) {
                els.grid.innerHTML = '';
                cardEls = {};
                list.forEach(function (e) {
                    var card = document.createElement('article');
                    card.className = 'card' + (state.selected[e.key] ? ' selected' : '');
                    cardEls[e.key] = card;
                    var pick = document.createElement('input');
                    pick.type = 'checkbox';
                    pick.className = 'pick';
                    pick.tabIndex = -1;
                    pick.checked = !!state.selected[e.key];
                    pick.setAttribute('aria-hidden', 'true');
                    card.appendChild(pick);
                    card.tabIndex = 0;
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', (state.selecting ? 'Select ' : 'Open ') + e.title);
                    card.setAttribute('aria-pressed', state.selecting ? String(!!state.selected[e.key]) : 'false');

                    var title = document.createElement('div');
                    title.className = 'card-title';
                    title.textContent = e.title;

                    var meta = document.createElement('div');
                    meta.className = 'meta';
                    var kind = document.createElement('span');
                    kind.className = 'badge';
                    kind.textContent = kindLabel(e.kind);
                    meta.appendChild(kind);
                    meta.appendChild(document.createTextNode(e.source === 'cloud' ? 'cloud' : (e.source === 'local' ? 'this device' : (e.folder || 'unsorted'))));
                    var lic = document.createElement('span');
                    lic.className = 'badge' + (e.licence === 'unverified' ? ' warn' : '');
                    lic.textContent = e.licence;
                    meta.appendChild(lic);

                    var thumbEl = makeThumb(e);
                    card.appendChild(thumbEl);
                    card.appendChild(title);
                    card.appendChild(meta);
                    if (e.userTags.length) {
                        var tl = document.createElement('div');
                        tl.className = 'meta';
                        e.userTags.forEach(function (t) {
                            var u = document.createElement('span');
                            u.className = 'user-tag';
                            u.textContent = t;
                            tl.appendChild(u);
                        });
                        card.appendChild(tl);
                    }
                    function activate() { if (state.selecting) toggleSelected(e.key); else openViewer(e); }
                    card.addEventListener('click', activate);
                    card.addEventListener('keydown', function (ev) {
                        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activate(); }
                    });
                    els.grid.appendChild(card);

                    if (thumbEl.querySelector('canvas') && observer) observer.observe(thumbEl);
                    else if (thumbEl.querySelector('canvas')) thumbEl.dispatchEvent(new Event('show'));
                });
            }

            // ---- Cloud panel ----
            function renderCloudBox() {
                els.cloudbox.innerHTML = '';
                els.cloudbox.hidden = state.view !== 'cloud';
                if (state.view !== 'cloud') return;
                if (!C || !C.ready()) {
                    els.cloudbox.appendChild(p('The cloud library did not load. Check the connection and reload. Local items still work.', 'warn'));
                    return;
                }
                if (!state.session) {
                    var email = input('email', 'Email', 'owner account email');
                    var pass = input('password', 'Password', 'Password');
                    var go = button('Sign in', 'primary', function () {
                        if (!email.value.trim() || !pass.value) { els.note.textContent = 'Enter your email and password.'; return; }
                        C.signIn(email.value.trim(), pass.value).then(function () {
                            pass.value = '';
                            els.note.textContent = 'Signed in.';
                            refresh();
                        }).catch(function (err) { els.note.textContent = 'Could not sign in: ' + err.message; });
                    });
                    var row = document.createElement('div');
                    row.className = 'row';
                    row.appendChild(email); row.appendChild(pass); row.appendChild(go);
                    els.cloudbox.appendChild(p('Sign in with the owner account, the same as Quick Detail. Only that account can read or write the cloud library.', ''));
                    els.cloudbox.appendChild(row);
                    if (state.cloudError) els.cloudbox.appendChild(p(state.cloudError, 'warn'));
                    return;
                }
                var who = document.createElement('div');
                who.className = 'row';
                who.appendChild(p('Signed in as ' + (state.session.user && state.session.user.email ? state.session.user.email : 'owner') + '.', ''));
                who.appendChild(button('Sign out', '', function () {
                    C.signOut().then(function () { state.session = null; state.cloudRows = null; refresh(); })
                        .catch(function (err) { els.note.textContent = 'Could not sign out: ' + err.message; });
                }));
                els.cloudbox.appendChild(who);
                if (state.cloudError) els.cloudbox.appendChild(p(state.cloudError, 'warn'));
            }

            function p(text, cls) {
                var el = document.createElement('p');
                el.className = 'note' + (cls ? ' ' + cls : '');
                el.textContent = text;
                return el;
            }
            function input(type, label, placeholder) {
                var i = document.createElement('input');
                i.type = type;
                i.placeholder = placeholder;
                i.setAttribute('aria-label', label);
                return i;
            }
            function button(text, cls, fn) {
                var b = document.createElement('button');
                b.className = cls || 'plain';
                b.textContent = text;
                b.addEventListener('click', fn);
                return b;
            }

            // ---- Viewer ----
            function openViewer(e) {
                state.current = e;
                els.dTitle.textContent = e.title;
                els.dName.value = e.title;
                els.dCredit.textContent = [e.licence, e.credit, e.origin].filter(Boolean).join(' · ');
                els.dMsg.textContent = '';
                els.dBody.innerHTML = '';
                if (e.source === 'repo') {
                    els.dFile.href = urlOf(e.path);
                    els.dFile.hidden = false;
                } else {
                    els.dFile.hidden = true;
                }
                els.dQd.hidden = e.source !== 'cloud';
                showImage(e);
                renderViewerTags();
                renderActions();
                if (typeof els.dialog.showModal === 'function') els.dialog.showModal();
            }

            function showImage(e) {
                els.dBody.innerHTML = '';
                if (e.kind === 'pdf') {
                    var frame = document.createElement('iframe');
                    frame.src = (e.source === 'repo' ? urlOf(e.path) : blobUrl(e)) + '#view=FitH';
                    frame.title = e.title;
                    els.dBody.appendChild(frame);
                    return;
                }
                var img = document.createElement('img');
                img.alt = e.title;
                if (e.source === 'cloud') {
                    els.dBody.appendChild(p('Loading the image from the cloud…', ''));
                    C.loadImage(e.id).then(function (src) {
                        if (state.current !== e) return;
                        img.src = src;
                        els.dBody.innerHTML = '';
                        els.dBody.appendChild(img);
                    }).catch(function (err) {
                        if (state.current !== e) return;
                        els.dBody.innerHTML = '';
                        els.dBody.appendChild(p('Could not load the image: ' + err.message, 'warn'));
                    });
                    return;
                }
                img.src = srcOf(e);
                els.dBody.appendChild(img);
            }

            function renderViewerTags() {
                var e = state.current;
                els.dTags.innerHTML = '';
                if (!e) return;
                e.folderTags.forEach(function (t) {
                    var b = document.createElement('span');
                    b.className = 'badge';
                    b.textContent = t + ' (folder)';
                    els.dTags.appendChild(b);
                });
                e.userTags.forEach(function (t) {
                    els.dTags.appendChild(button(t + ' ×', 'plain', function () { removeTag(e, t); }));
                });
                var add = input('text', 'Add a tag', 'Add a tag');
                add.maxLength = 40;
                function commit() {
                    var t = add.value.trim();
                    if (t) addTag(e, t);
                }
                add.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
                els.dTags.appendChild(add);
                els.dTags.appendChild(button('Add tag', 'plain', commit));
            }

            function setTagsFor(e, list) {
                if (e.source === 'cloud') {
                    e.userTags = list;
                    return C.setTags(e.id, list).then(function () { refreshCloudRow(e); });
                }
                e.userTags = list;
                S.setLocalTags(e.key, list);
                return Promise.resolve();
            }

            function refreshCloudRow(e) {
                if (state.cloudRows) state.cloudRows.forEach(function (r) { if (r.id === e.id) r.tags = e.userTags; });
            }

            function addTag(e, t) {
                var list = unique(e.userTags.concat([t]));
                setTagsFor(e, list).then(function () { renderViewerTags(); render(); })
                    .catch(function (err) { els.dMsg.textContent = 'Could not save the tag: ' + err.message; });
            }

            function removeTag(e, t) {
                var list = e.userTags.filter(function (x) { return x !== t; });
                setTagsFor(e, list).then(function () { renderViewerTags(); render(); })
                    .catch(function (err) { els.dMsg.textContent = 'Could not remove the tag: ' + err.message; });
            }

            function renameCurrent() {
                var e = state.current;
                var name = els.dName.value.trim();
                if (!e || !name) return;
                var job;
                if (e.source === 'cloud') {
                    job = C.rename(e.id, name).then(function () {
                        if (state.cloudRows) state.cloudRows.forEach(function (r) { if (r.id === e.id) r.name = name; });
                    });
                } else {
                    job = Promise.resolve(S.setName(e.key, name === e.originTitle ? '' : name));
                }
                job.then(function () {
                    e.title = name;
                    els.dTitle.textContent = name;
                    els.dMsg.textContent = 'Name saved.';
                    render();
                }).catch(function (err) { els.dMsg.textContent = 'Could not save the name: ' + err.message; });
            }

            function renderActions() {
                var e = state.current;
                els.dActions.innerHTML = '';
                if (!e) return;
                if (e.source === 'repo' || e.source === 'local') {
                    els.dActions.appendChild(button('Copy to cloud', 'plain', function () { copyToCloud(e); }));
                }
                if (e.source === 'cloud') {
                    els.dActions.appendChild(button('Copy to this device', 'plain', function () { copyToLocal(e); }));
                }
                if (e.source === 'cloud') {
                    els.dActions.appendChild(button('Open in Quick Detail', 'plain', openInQuickDetail));
                }
                els.dActions.appendChild(button('Delete', 'danger', function () {
                    confirmDelete([e], function () {
                        deleteEntries([e]).then(function (r) {
                            els.dialog.close();
                            els.note.textContent = deleteSummary(r);
                        });
                    });
                }));
            }

            function openInQuickDetail() {
                var url = C && C.config.quickDetailUrl;
                if (!url) {
                    els.dMsg.textContent = 'Set the Quick Detail address (quickDetailUrl in library-cloud.js) to open it from here.';
                    return;
                }
                var e = state.current;
                if (!e || !e.localId) { els.dMsg.textContent = 'Copy this item to the cloud first.'; return; }
                window.open(url + '#import=' + encodeURIComponent(e.localId), '_blank', 'noopener');
            }

            // ---- Copies ----
            function requireSession() {
                if (!state.session) {
                    els.dMsg.textContent = 'Sign in on the Cloud tab first.';
                    return false;
                }
                return true;
            }

            function fetchBlob(e) {
                if (e.source === 'local') return Promise.resolve(e.blob);
                return fetch(urlOf(e.path)).then(function (r) {
                    if (!r.ok) throw new Error('the file returned ' + r.status);
                    return r.blob();
                }).catch(function (err) {
                    throw new Error('could not read the file (' + err.message + '). Copying to the cloud needs the library served over http, such as GitHub Pages or a local server.');
                });
            }

            // Makes a JPEG of the first page or the whole image, and a small thumbnail. Works for PNG, JPEG, WEBP, GIF, SVG and PDF.
            function toJpeg(blob, kind) {
                if (kind === 'pdf') {
                    if (!window.pdfjsLib) return Promise.reject(new Error('pdf.js did not load, so PDFs cannot be copied.'));
                    return blob.arrayBuffer().then(function (buf) {
                        return window.pdfjsLib.getDocument({ data: buf }).promise;
                    }).then(function (doc) { return doc.getPage(1); }).then(function (page) {
                        var base = page.getViewport({ scale: 1 });
                        var scale = Math.min(1, MAX_PX / Math.max(base.width, base.height)) * 2;
                        var vp = page.getViewport({ scale: scale });
                        var c = document.createElement('canvas');
                        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
                        return page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () {
                            return drawResized(c, c.width, c.height);
                        });
                    });
                }
                var url = URL.createObjectURL(blob);
                return loadImg(url).then(function (img) {
                    var w = img.naturalWidth || 1000, h = img.naturalHeight || 1000;
                    URL.revokeObjectURL(url);
                    return drawResized(img, w, h);
                });
            }

            function loadImg(url) {
                return new Promise(function (resolve, reject) {
                    var img = new Image();
                    img.onload = function () { resolve(img); };
                    img.onerror = function () { reject(new Error('the image could not be read')); };
                    img.src = url;
                });
            }

            function drawResized(source, w, h) {
                var k = Math.min(1, MAX_PX / Math.max(w, h));
                var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
                var c = document.createElement('canvas');
                c.width = cw; c.height = ch;
                var ctx = c.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, cw, ch);
                ctx.drawImage(source, 0, 0, cw, ch);
                var t = Math.min(1, THUMB_PX / Math.max(cw, ch));
                var tc = document.createElement('canvas');
                tc.width = Math.max(1, Math.round(cw * t)); tc.height = Math.max(1, Math.round(ch * t));
                var tctx = tc.getContext('2d');
                tctx.fillStyle = '#ffffff';
                tctx.fillRect(0, 0, tc.width, tc.height);
                tctx.drawImage(c, 0, 0, tc.width, tc.height);
                return {
                    dataUrl: c.toDataURL('image/jpeg', 0.9),
                    thumbUrl: tc.toDataURL('image/jpeg', 0.8),
                    width: cw, height: ch
                };
            }

            function copyToCloud(e) {
                if (!requireSession()) return;
                els.dMsg.textContent = 'Copying to the cloud…';
                fetchBlob(e)
                    .then(function (blob) { return toJpeg(blob, e.kind); })
                    .then(function (image) { return C.save(e, image); })
                    .then(function () {
                        els.dMsg.textContent = 'Copied to the cloud. The original stays where it was.';
                        state.cloudRows = null;
                    })
                    .catch(function (err) { els.dMsg.textContent = 'Copy failed: ' + err.message; });
            }

            function copyToLocal(e) {
                els.dMsg.textContent = 'Copying to this device…';
                C.loadImage(e.id)
                    .then(function (dataUrl) { return fetch(dataUrl); })
                    .then(function (r) { return r.blob(); })
                    .then(function (blob) {
                        var id = e.localId || C.rowIdFor(e.key);
                        return S.putCopy({
                            id: id, name: e.originTitle, kind: e.kind, mime: 'image/jpeg', blob: blob,
                            licence: e.licence, credit: e.credit, source: e.origin, cloudId: e.id, created: Date.now()
                        });
                    })
                    .then(function () {
                        els.dMsg.textContent = 'Copied to this device. The cloud copy stays too.';
                    })
                    .catch(function (err) { els.dMsg.textContent = 'Copy failed: ' + err.message; });
            }

            function addFilesToDevice(fileList) {
                var files = Array.prototype.slice.call(fileList || []);
                if (!files.length || !S) return;
                Promise.all(files.map(function (f) {
                    var kind = kindOf(f.type, f.name);
                    var id = 'f-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
                    return S.putCopy({ id: id, name: f.name.replace(/\.[^.]+$/, ''), kind: kind, mime: f.type, blob: f, licence: 'unverified', credit: '', source: '', created: Date.now() });
                })).then(function () {
                    els.note.textContent = 'Added ' + files.length + (files.length === 1 ? ' file' : ' files') + ' to this device. Set the licence in licences.json to show it on the repo side.';
                    refresh();
                }).catch(function (err) { els.note.textContent = 'Could not add the files: ' + err.message; });
            }

            // ---- Selecting several details: tags panel and delete ----
            var panel = {
                root: document.getElementById('panel'),
                title: document.getElementById('panel-title'),
                staged: document.getElementById('panel-staged'),
                stagedEmpty: document.getElementById('panel-staged-empty'),
                popular: document.getElementById('panel-popular'),
                recent: document.getElementById('panel-recent'),
                manual: document.getElementById('panel-manual'),
                apply: document.getElementById('panel-apply'),
                msg: document.getElementById('panel-msg')
            };
            var selectBtn = document.getElementById('select-mode');

            function selectedEntries() {
                return state.entries.filter(function (e) { return state.selected[e.key]; });
            }

            function splitTags(text) {
                return unique(String(text || '').split(',').map(function (t) { return t.trim().slice(0, 40); }));
            }

            function setSelecting(on) {
                state.selecting = on;
                if (!on) { state.selected = {}; state.staged = []; panel.msg.textContent = ''; }
                document.body.classList.toggle('selecting', on);
                selectBtn.classList.toggle('on', on);
                selectBtn.setAttribute('aria-pressed', String(on));
                selectBtn.textContent = on ? 'Done' : 'Select';
                render();
                renderPanel();
            }

            function toggleSelected(key) {
                if (state.selected[key]) delete state.selected[key]; else state.selected[key] = true;
                var card = cardEls[key];
                if (card) {
                    card.classList.toggle('selected', !!state.selected[key]);
                    card.querySelector('.pick').checked = !!state.selected[key];
                    card.setAttribute('aria-pressed', String(!!state.selected[key]));
                }
                renderPanel();
            }

            function chipRow(host, tags, empty) {
                host.innerHTML = '';
                if (!tags.length) { host.appendChild(p(empty, '')); return; }
                tags.forEach(function (t) {
                    var on = state.staged.indexOf(t) >= 0;
                    var b = document.createElement('button');
                    b.className = 'chip' + (on ? ' on' : '');
                    b.setAttribute('aria-pressed', String(on));
                    b.textContent = t;
                    b.addEventListener('click', function () { toggleStaged(t); });
                    host.appendChild(b);
                });
            }

            function toggleStaged(t) {
                state.staged = state.staged.indexOf(t) >= 0 ? state.staged.filter(function (x) { return x !== t; }) : state.staged.concat([t]);
                renderPanel();
            }

            function popularTags() {
                var counts = {};
                state.entries.forEach(function (e) { allTagsOf(e).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
                return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); }).slice(0, 12);
            }

            function renderPanel() {
                var n = selectedEntries().length;
                var open = state.selecting && n > 0;
                panel.root.classList.toggle('open', open);
                panel.root.setAttribute('aria-hidden', String(!open));
                panel.title.textContent = n + ' selected';
                panel.staged.innerHTML = '';
                state.staged.forEach(function (t) {
                    panel.staged.appendChild(button(t + ' ×', 'plain', function () { toggleStaged(t); }));
                });
                panel.stagedEmpty.hidden = state.staged.length > 0;
                chipRow(panel.popular, popularTags(), 'No tags yet.');
                chipRow(panel.recent, S ? S.recentTags().slice(0, 12) : [], 'Nothing used recently.');
                panel.apply.disabled = !n;
                panel.apply.textContent = n === 1 ? 'Add tags to 1 detail' : 'Add tags to ' + n + ' details';
            }

            function stageManual() {
                var list = splitTags(panel.manual.value);
                list.forEach(function (t) { if (state.staged.indexOf(t) < 0) state.staged.push(t); });
                panel.manual.value = '';
                renderPanel();
            }

            function applyTags() {
                stageManual();
                var targets = selectedEntries();
                if (!targets.length) return;
                if (!state.staged.length) { panel.msg.textContent = 'Pick or type at least one tag first.'; return; }
                var tags = state.staged.slice();
                panel.apply.disabled = true;
                panel.msg.textContent = 'Saving tags…';
                Promise.all(targets.map(function (e) {
                    return setTagsFor(e, unique(e.userTags.concat(tags))).then(function () { return null; }, function (err) { return err; });
                })).then(function (errs) {
                    var failed = errs.filter(Boolean);
                    if (S) S.pushRecentTags(tags);
                    state.staged = [];
                    panel.msg.textContent = failed.length
                        ? 'Tagged ' + (targets.length - failed.length) + ' of ' + targets.length + '. Could not save the rest: ' + failed[0].message
                        : 'Added ' + tags.length + (tags.length === 1 ? ' tag' : ' tags') + ' to ' + targets.length + (targets.length === 1 ? ' detail.' : ' details.');
                    render();
                    renderPanel();
                });
            }

            // Delete: asks once, then not again for 5 minutes.
            var confirmEls = {
                dialog: document.getElementById('confirm'),
                text: document.getElementById('confirm-text'),
                ok: document.getElementById('confirm-ok'),
                cancel: document.getElementById('confirm-cancel')
            };
            var pendingDelete = null;

            function confirmDelete(list, go) {
                if (Date.now() < state.noConfirmUntil) { go(); return; }
                var repo = list.filter(function (e) { return e.source === 'repo'; }).length;
                var text = 'Delete ' + (list.length === 1 ? '“' + list[0].title + '”' : list.length + ' details') + '? This cannot be undone.';
                if (repo) text += ' Files from the repo are hidden on this device, since the files themselves live in the repo.';
                confirmEls.text.textContent = text;
                pendingDelete = go;
                if (typeof confirmEls.dialog.showModal === 'function') confirmEls.dialog.showModal();
                confirmEls.cancel.focus();
            }

            confirmEls.cancel.addEventListener('click', function () { pendingDelete = null; confirmEls.dialog.close(); });
            confirmEls.ok.addEventListener('click', function () {
                var go = pendingDelete;
                pendingDelete = null;
                state.noConfirmUntil = Date.now() + CONFIRM_QUIET_MS;
                confirmEls.dialog.close();
                if (go) go();
            });

            function deleteOne(e) {
                if (e.source === 'cloud') return C.remove(e.id);
                if (e.source === 'local') {
                    return S.deleteCopy(e.id).then(function () {
                        S.forget(e.key);
                        if (state.urls[e.key]) { URL.revokeObjectURL(state.urls[e.key]); delete state.urls[e.key]; }
                    });
                }
                S.hide(e.key);
                S.forget(e.key);
                return Promise.resolve();
            }

            function deleteEntries(list) {
                return Promise.all(list.map(function (e) {
                    return deleteOne(e).then(function () { return null; }, function (err) { return err; });
                })).then(function (errs) {
                    var done = [];
                    list.forEach(function (e, i) { if (!errs[i]) done.push(e.key); });
                    done.forEach(function (k) { delete state.selected[k]; });
                    var gone = {};
                    done.forEach(function (k) { gone[k] = true; });
                    state.entries = state.entries.filter(function (e) { return !gone[e.key]; });
                    if (state.cloudRows) state.cloudRows = state.cloudRows.filter(function (r) { return !gone['cloud:' + r.id]; });
                    render();
                    renderPanel();
                    return { deleted: done.length, failed: errs.filter(Boolean) };
                });
            }

            function deleteSummary(r) {
                if (r.failed.length) return 'Deleted ' + r.deleted + '. Could not delete ' + r.failed.length + ': ' + r.failed[0].message;
                return 'Deleted ' + r.deleted + (r.deleted === 1 ? ' detail.' : ' details.');
            }

            function deleteSelected() {
                var list = selectedEntries();
                if (!list.length) return;
                confirmDelete(list, function () {
                    deleteEntries(list).then(function (r) { panel.msg.textContent = deleteSummary(r); });
                });
            }

            selectBtn.addEventListener('click', function () { setSelecting(!state.selecting); });
            document.getElementById('panel-close').addEventListener('click', function () { state.selected = {}; state.staged = []; render(); renderPanel(); });
            document.getElementById('panel-all').addEventListener('click', function () {
                state.entries.filter(matches).forEach(function (e) { state.selected[e.key] = true; });
                render();
                renderPanel();
            });
            document.getElementById('panel-stage').addEventListener('click', stageManual);
            panel.manual.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); stageManual(); } });
            panel.manual.addEventListener('input', function () { if (/,/.test(panel.manual.value)) stageManual(); });
            panel.apply.addEventListener('click', applyTags);
            document.getElementById('panel-delete').addEventListener('click', deleteSelected);

            // ---- Page-level wiring ----
            function setView(view) {
                state.view = view;
                document.querySelectorAll('[data-view]').forEach(function (b) {
                    var on = b.getAttribute('data-view') === view;
                    b.classList.toggle('on', on);
                    b.setAttribute('aria-selected', String(on));
                });
                state.tags = [];
                state.selected = {};
                var up = document.getElementById('upload');
                if (up) up.hidden = view !== 'local';
                refresh();
            }

            function setBg(bg) {
                document.body.classList.toggle('bg-dark', bg === 'dark');
                document.body.classList.toggle('bg-mono', bg === 'mono');
                document.querySelectorAll('[data-bg]').forEach(function (b) {
                    var on = b.getAttribute('data-bg') === bg;
                    b.classList.toggle('on', on);
                    b.setAttribute('aria-pressed', String(on));
                });
                if (S) S.writeBg(bg);
            }

            function render() {
                renderCloudBox();
                var list = sortEntries(state.entries.filter(matches));
                var total = state.entries.length;
                els.count.textContent = list.length === total
                    ? total + (total === 1 ? ' item' : ' items')
                    : list.length + ' of ' + total + ' items';
                renderTags();
                renderGrid(list);
                if (state.view === 'cloud' && !state.session && !state.cloudError) {
                    els.empty.textContent = 'Sign in above to see your cloud copies.';
                } else if (total === 0) {
                    els.empty.textContent = state.view === 'cloud'
                        ? 'No cloud copies yet. Open an item on the Local tab and choose Copy to cloud.'
                        : 'No files yet. Add images, SVGs or PDFs under images/raw/, or add files to this device.';
                } else {
                    els.empty.textContent = 'Nothing matches.';
                }
                els.empty.hidden = list.length > 0;
            }

            els.search.addEventListener('input', function () { state.query = els.search.value.trim().toLowerCase(); render(); });
            els.kind.addEventListener('change', function () { state.kind = els.kind.value; render(); });
            els.licence.addEventListener('change', function () { state.licence = els.licence.value; render(); });
            els.sort.addEventListener('change', function () { state.sort = els.sort.value; render(); });
            document.querySelectorAll('[data-view]').forEach(function (b) {
                b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
            });
            document.querySelectorAll('[data-bg]').forEach(function (b) {
                b.addEventListener('click', function () { setBg(b.getAttribute('data-bg')); });
            });
            els.dRename.addEventListener('click', renameCurrent);
            els.dName.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); renameCurrent(); } });
            els.dQd.addEventListener('click', openInQuickDetail);
            els.dClose.addEventListener('click', function () { els.dialog.close(); });
            els.dialog.addEventListener('click', function (ev) { if (ev.target === els.dialog) els.dialog.close(); });
            els.dialog.addEventListener('close', function () {
                els.dBody.innerHTML = '';
                state.current = null;
                render();
            });

            // A file input on the local tab adds files from this device.
            var picker = document.createElement('input');
            picker.type = 'file';
            picker.multiple = true;
            picker.accept = 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml,application/pdf';
            picker.id = 'picker';
            picker.setAttribute('aria-label', 'Add files to this device');
            picker.addEventListener('change', function () { addFilesToDevice(picker.files); picker.value = ''; });
            els.note.parentNode.insertBefore(picker, els.note);
            picker.hidden = true;
            document.getElementById('upload').addEventListener('click', function () { picker.click(); });
            document.getElementById('upload').hidden = state.view !== 'local';

            if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            if (S) setBg(S.readBg());
            if (S && !S.status.storage) els.note.textContent = 'Browser storage is blocked, so names, tags and copies on this device will not be kept.';
            refresh();
        })();
    </script>
</body>
</html>
